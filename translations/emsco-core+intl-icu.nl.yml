asset_extractor:
    status: |-
        {color, select,
            green   {Groen: asset extractor is operationeel}
            red     {Rood: asset extractor is niet volledig operationeel. Neem contact op met uw systeembeheerder}
            other   {Dat is vreemd... Neem contact op met uw systeembeheerder}
        }
certificate:
    status: |-
        {color, select,
            green   {Groen: er is een geldig certificaat aanwezig}
            yellow  {Geel: certificaat ontbreekt of is niet geconfigureerd}
            red     {Rood: privésleutel niet gevonden}
            other   {Dat is vreemd... Neem contact op met uw systeembeheerder}
        }
cluster:
    status: |-
        {color, select,
            green   {Groen: zoekcluster werkt zoals verwacht}
            yellow  {Geel: documenten worden geïndexeerd. Deze status zou niet blijvend mogen zijn}
            red     {Rood: systeemproblemen gedetecteerd. Neem contact op met uw beheerder}
            other   {Dat is vreemd... Neem contact op met uw systeembeheerder}
        }
